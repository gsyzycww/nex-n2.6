<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nex Chat · 所见，即行动</title>
  <meta name="description" content="Nex Chat：基于 MOSS 平台 nex-n2.6 模型的流式对话演示。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      const theme = localStorage.getItem('nex-chat:theme');
      document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
    } catch (_) {}
  </script>
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true"><img src="/logo/nex.svg" alt="" /></span>
          <span class="brand-name">Nex Chat</span>
        </div>
        <button class="btn-new" id="newChatBtn" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>
          新对话
        </button>
      </div>

      <nav class="conv-list" id="convList" aria-label="对话列表"></nav>

      <div class="sidebar-foot">
        <div class="foot-row">
          <span class="key-status" id="keyStatus"></span>
          <div class="foot-actions">
            <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
              <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
            </button>
          </div>
        </div>
        <p class="foot-note">本地会话存储 · 仅用于演示</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="打开对话列表">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-title" id="chatTitle">新对话</div>
        <div class="topbar-actions">
          <span class="model-badge" id="modelBadge">nex-n2.6</span>
          <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages">
        <div class="empty" id="emptyState">
          <div class="empty-logo" aria-hidden="true"><img src="/logo/nex.svg" alt="" /></div>
          <h1>有什么可以帮你？</h1>
          <p>Nex Chat 由 MOSS 平台的 nex-n2.6 模型驱动，支持流式对话。</p>
          <div class="suggestions">
            <button class="suggestion" type="button" data-prompt="用三句话解释一下 Transformer 的工作原理。">用三句话解释 Transformer 的工作原理</button>
            <button class="suggestion" type="button" data-prompt="帮我写一个 Python 快速排序，并加上注释。">写一个带注释的 Python 快速排序</button>
            <button class="suggestion" type="button" data-prompt="把下面这句话翻译成英文：今天天气很好，适合出门散步。">翻译一句中文到英文</button>
            <button class="suggestion" type="button" data-prompt="给我三条提高专注力的小建议，每条不超过 20 个字。">三条提高专注力的小建议</button>
          </div>
        </div>
        <div class="msg-list" id="msgList"></div>
      </section>

      <footer class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="给 Nex 发送消息…" title="Enter 发送，Shift + Enter 换行" aria-label="消息输入框"></textarea>
          <button class="send-btn" id="sendBtn" type="button" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          </button>
          <button class="stop-btn" id="stopBtn" type="button" title="停止生成" aria-label="停止生成" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
          </button>
        </div>
        <div class="composer-hint">
          <span id="usageHint"></span>
          <span>内容由 AI 生成，请注意甄别</span>
        </div>
      </footer>
    </main>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-backdrop" data-close="settings"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-btn" type="button" data-close="settings" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">MOSS API Key</span>
          <input type="password" id="setApiKey" autocomplete="off" spellcheck="false" placeholder="moss-xxxxxxxx" />
          <span class="field-hint">保存在本浏览器 localStorage；也可改用服务端环境变量 MOSS_API_KEY，此时这里留空即可。</span>
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label">模型</span>
            <input type="text" id="setModel" spellcheck="false" placeholder="nex-n2.6" />
          </label>
          <label class="field">
            <span class="field-label">最大输出 Token</span>
            <input type="number" id="setMaxTokens" min="1" max="131072" step="1" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">系统提示词（可选）</span>
          <textarea id="setSystemPrompt" rows="2" placeholder="例如：你是一名简洁耐心的助手，用中文回答。"></textarea>
        </label>
        <label class="switch">
          <input type="checkbox" id="setStream" />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text">流式输出<span class="field-hint">逐字返回，体验更好</span></span>
        </label>
        <label class="switch">
          <input type="checkbox" id="setThinking" />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text">开启思考模式<span class="field-hint">请求中携带 thinking.type = enabled</span></span>
        </label>
      </div>
      <div class="modal-foot">
        <button class="btn-danger-ghost" id="clearAllBtn" type="button">清空全部对话</button>
        <div class="foot-actions">
          <button class="btn-ghost" type="button" data-close="settings">取消</button>
          <button class="btn-primary" id="saveSettingsBtn" type="button">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
